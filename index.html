<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT: The Four Year Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-header">
        <div id="titleBanner">IT: The Four Year Game</div>
        <button id="muteButton" type="button" aria-label="Mute sound">🔊</button>
      </header>

      <section id="startScreen" class="screen active">
        <div class="title-hero">
          <div id="titleHost" class="title-canvas-host"><canvas id="titleCanvas" role="img" aria-label="Two students and a cat walking across campus through four school years"></canvas></div>
          <div class="title-logo">
            <p class="kicker">A life-sim for IT students</p>
            <h1><span class="logo-it">IT:</span> The Four Year Game</h1>
            <div class="year-pips" aria-hidden="true"><span>Y1</span><span>Y2</span><span>Y3</span><span>Y4</span></div>
          </div>
        </div>
        <div class="panel intro-panel">
          <p>Survive four years of system admin classes, all-nighters, group projects, and one very memorable final defense.</p>
          <div class="menu-buttons">
            <button id="startButton" type="button">Start</button>
            <button id="continueButton" type="button" class="secondary">Continue</button>
          </div>
        </div>
      </section>

      <section id="characterScreen" class="screen hidden">
        <div class="panel character-panel">
          <h2>Create Your Character</h2>
          <div class="character-layout">
            <div class="char-stage">
              <div id="characterHost" class="char-canvas-host"><canvas id="characterCanvas" role="img" aria-label="Your student walking across campus"></canvas></div>
              <div class="look-strip" id="lookStrip" aria-label="Your look in each year"></div>
            </div>
            <div class="char-form">
              <label for="playerName" class="field-label">Name</label>
              <div class="name-row"><input id="playerName" type="text" maxlength="12" value="Student" autocomplete="off" /><span id="nameCount" class="name-count">7/12</span></div>
              <fieldset class="gender-choice">
                <legend class="field-label">Choose your student</legend>
                <label class="pick-card"><input type="radio" name="character" value="boy" checked /><canvas width="72" height="102" data-gender="boy" aria-hidden="true"></canvas><span>Boy</span></label>
                <label class="pick-card"><input type="radio" name="character" value="girl" /><canvas width="72" height="102" data-gender="girl" aria-hidden="true"></canvas><span>Girl</span></label>
              </fieldset>
              <button id="beginGameButton" type="button">Begin</button>
            </div>
          </div>
        </div>
      </section>

      <section id="gameScreen" class="screen hidden">
        <div class="stage-frame">
          <div id="sceneViewport" class="scene-viewport">
            <canvas id="sceneCanvas" width="960" height="288" role="img" aria-label="Your character on the school campus"></canvas>
          </div>
          <div class="hud">
            <div class="hud-row">
              <div class="year-label">YEAR <span id="yearDisplay">1</span></div>
              <div class="name-label"><span id="playerNameDisplay">Student</span></div>
            </div>
            <div class="stats" id="statsContainer" aria-label="Your stats"></div>
          </div>
          <div id="statTooltip" class="stat-tooltip hidden" role="tooltip"></div>
          <div class="scene-caption"><span id="sceneYearLabel">Bright morning</span><span id="sceneStatus" role="status">On campus</span></div>
        </div>
        <div class="dialog-space">
          <section id="eventDialog" class="pixel-dialog hidden" data-theme="social" role="dialog" aria-modal="false" aria-labelledby="dialogSpeaker" tabindex="-1">
            <div class="dialog-topline"><span id="dialogSpeaker" class="speaker-tag">Campus life</span><button id="finishTextButton" type="button" class="text-skip hidden">Show text</button></div>
            <div class="story-panel" id="eventPanel"></div>
          </section>
        </div>
      </section>

      <dialog id="yearTransition" class="year-transition" aria-labelledby="yearTitle">
        <p id="yearComplete" class="year-complete"></p>
        <h2 id="yearTitle"></h2><p id="yearSubtitle"></p>
        <canvas id="yearSprite" width="96" height="136" aria-label="Your new outfit"></canvas>
        <div id="yearRecap" class="year-recap"></div>
        <button id="yearContinue" type="button">Start the new year</button>
        <button id="yearMute" type="button" class="secondary">Mute sound</button>
      </dialog>
      <section id="endingScreen" class="screen hidden">
        <div class="panel ending-panel" id="endingPanel"></div>
      </section>
    </div>

    <script src="js/sprites.js"></script>
    <script src="js/scenery.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/events.js"></script>
    <script src="js/bosses.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
